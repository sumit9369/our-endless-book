<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Little Games | Piyaaa & Babuchak</title>

 <a href="online-games.html" class="online-link">
  🌐 Play Together Online ♡

<body>
<header>
 <div>✦ A LITTLE WORLD FOR TWO ✦</div>
 <h1>Our Little Games ♡</h1>
 <p>Piyaaa ❤️‍🩹 & Babuchak 😃</p>
 <p>Ask • Guess • Laugh • Repeat</p>
</header>

<main>
<section class="panel center">
 <h2>🏆 Our Friendship Scores</h2>
 <div class="score">
  <div>Piyaaa ❤️‍🩹<strong id="s0">0</strong></div>
  <div>Babuchak 😃<strong id="s1">0</strong></div>
 </div>
 <button class="secondary" onclick="resetScores()">Reset Scores</button>
</section>

<section id="menu" class="panel">
 <h2 class="center">Choose Our Game ♡</h2>
 <div id="gameGrid" class="grid"></div>
</section>

<section id="play" class="panel center hidden">
 <button class="secondary" onclick="home()">← Games</button>
 <button class="secondary" onclick="restart()">↻ Restart</button>
 <h2 id="title"></h2>
 <div id="screen"></div>
</section>
</main>

<footer>Two friends • Two hearts • One little world ♡</footer>

<script>
 const SUPABASE_URL =
 "https://hwqccyftcaoqcmxmhdal.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_C2_98shKT_qdOI8CFjYPKg_g-FUhqZf";

const ROOM_ID =
 "ca778c34-f9c3-4d61-8d18-46750168c556";
"use strict";
const $=id=>document.getElementById(id);
const names=["Piyaaa ❤️‍🩹","Babuchak 😃"];
let scores=[0,0],current=-1,S={},generation=0;

try{
 const x=JSON.parse(localStorage.getItem("ourBestieScores"));
 if(Array.isArray(x)&&x.length===2&&
 x.every(n=>Number.isFinite(n)&&n>=0))scores=x;
}catch(e){}

function save(){
 try{localStorage.setItem("ourBestieScores",JSON.stringify(scores))}
 catch(e){}
 $("s0").textContent=scores[0];
 $("s1").textContent=scores[1];
}
function award(p,n=10){scores[p]+=n;save()}
function resetScores(){
 if(confirm("Reset both scores?")){scores=[0,0];save()}
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}
function random(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){
 const b=[...a];
 for(let i=b.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}
function show(html){$("screen").innerHTML=html}
function addBtn(text,fn,cls="option"){
 const b=document.createElement("button");
 b.textContent=text;b.className=cls;b.onclick=fn;
 $("screen").appendChild(b);
 return b;
}
function options(arr,fn){
 arr.forEach((v,i)=>addBtn(v,()=>fn(i)));
}
function inputValue(id){return $(id).value.trim()}
function notice(msg){show("<div class='notice'>"+esc(msg)+"</div>")}
function continueWith(fn){addBtn("Continue →",fn)}
function playerName(p){return names[p]}
function nextTurn(success){
 if(success)S.p=1-S.p;
 S.round++;
 customAsk();
}

const games=[
 ["🧠","Friendship Quiz",()=>customStart("quiz")],
 ["🎭","Truth or Dare",()=>customStart("truth")],
 ["⚡","This or That",()=>customStart("this")],
 ["❌⭕","Tic Tac Toe",ticStart],
 ["🤔","Would You Rather",()=>customStart("rather")],
 ["🧩","Guess the Emoji",emojiStart],
 ["🍾","Spin the Bottle",bottleStart],
 ["🃏","Memory Match",memoryStart],
 ["🔤","Word Scramble",wordStart],
 ["🔴🟡","Connect Four",connectStart]
];
games.forEach((g,i)=>{
 const b=document.createElement("button");
 b.className="game";
 b.innerHTML="<span>"+g[0]+"</span><b>"+g[1]+"</b>";
 b.onclick=()=>openGame(i);
 $("gameGrid").appendChild(b);
});
function openGame(i){
 current=i;
 $("menu").classList.add("hidden");
 $("play").classList.remove("hidden");
 $("title").textContent=games[i][0]+" "+games[i][1];
 restart();
 $("play").scrollIntoView({behavior:"smooth"});
}
function home(){
 generation++;current=-1;
 $("play").classList.add("hidden");
 $("menu").classList.remove("hidden");
}
function restart(){
 generation++;S={};
 if(current>=0)games[current][2]();
}
save();

/* CUSTOM QUESTION GAMES -- 1, 2, 3, 5 */

function customStart(type){
 S={type,p:0,round:1};
 customAsk();
}
function customAsk(){
 const type=S.type,p=S.p;
 const title={
  quiz:"Create a tricky question",
  truth:"Create a Truth or Dare",
  this:"Create a This or That challenge",
  rather:"Create a Would You Rather challenge"
 }[type];

 let fields="";
 if(type==="quiz"){
  fields=`
   <input id="question" placeholder="Your tricky question">
   <input id="o0" placeholder="Option A">
   <input id="o1" placeholder="Option B">
   <input id="o2" placeholder="Option C">
   <input id="o3" placeholder="Option D">
   <label>Correct answer</label>
   <select id="correct" style="padding:12px;width:100%">
    <option value="0">Option A</option>
    <option value="1">Option B</option>
    <option value="2">Option C</option>
    <option value="3">Option D</option>
   </select>`;
 }else if(type==="truth"){
  fields=`
   <p>Choose what you want to ask.</p>
   <select id="kind" style="padding:12px;width:100%">
    <option value="Truth">Truth</option>
    <option value="Dare">Dare</option>
   </select>
   <textarea id="question" placeholder="Write your custom question or challenge"></textarea>`;
 }else{
  fields=`
   <textarea id="question" placeholder="Write a tricky situation or question"></textarea>
   <input id="o0" placeholder="First choice">
   <input id="o1" placeholder="Second choice">
   <label>Your secret choice (the answer they must predict)</label>
   <select id="correct" style="padding:12px;width:100%">
    <option value="0">First choice</option>
    <option value="1">Second choice</option>
   </select>`;
 }

 show(`
  <p>Round ${S.round}</p>
  <h3>${playerName(p)} is asking ♡</h3>
  <div class="notice">${title}</div>
  ${fields}
  <button id="sendQuestion">Send Challenge 💌</button>
  <p><small>The answer stays hidden until the guess is submitted.</small></p>
 `);
 $("sendQuestion").onclick=submitCustom;
}
function submitCustom(){
 const type=S.type;
 const q=inputValue("question");
 if(!q){alert("Write your question first.");return}
 let opts=[],correct=0,kind="";
 if(type==="quiz"||type==="this"||type==="rather"){
  const count=type==="quiz"?4:2;
  for(let i=0;i<count;i++){
   const v=inputValue("o"+i);
   if(!v){alert("Fill every option.");return}
   opts.push(v);
  }
  if(new Set(opts.map(x=>x.toLowerCase())).size!==count){
   alert("Use different options.");return;
  }
  correct=Number($("correct").value);
 }
 if(type==="truth")kind=$("kind").value;
 S.challenge={q,opts,correct,kind};
 S.receiver=1-S.p;
 show(`
  <h2>🔒 Challenge Ready!</h2>
  <p>Pass the phone to ${playerName(S.receiver)}.</p>
  <p>Do not show the creator's secret answer.</p>
 `);
 continueWith(customAnswer);
}
function customAnswer(){
 const c=S.challenge,type=S.type;
 show(`
  <p>Round ${S.round}</p>
  <h3>${playerName(S.receiver)}'s Turn</h3>
  <div class="notice">
   ${type==="truth"?esc(c.kind)+" -- ":""}${esc(c.q)}
  </div>
 `);
 if(type==="truth"){
  if(c.kind==="Truth"){
   const area=document.createElement("textarea");
   area.id="truthResponse";
   area.placeholder="Write your answer here...";
   $("screen").appendChild(area);
   addBtn("Submit Answer",()=>{
    const response=area.value.trim();
    if(!response){alert("Write an answer.");return}
    S.response=response;
    customJudge();
   });
  }else{
   addBtn("I completed the dare!",()=>{
    S.response="Dare marked complete";
    customJudge();
   });
  }
  addBtn("Skip Challenge",()=>customResult(false));
 }else{
  options(c.opts,i=>{
   const ok=i===c.correct;
   show("<h2>"+(ok?"💖 Correct Guess!":"😆 Wrong Guess!")+"</h2>"+
    "<p>Expected answer: "+esc(c.opts[c.correct])+"</p>");
   continueWith(()=>customResult(ok));
  });
 }
}
function customJudge(){
 show(`
  <h3>${playerName(S.p)}, check the response!</h3>
  <div class="notice">${esc(S.response)}</div>
 `);
 addBtn("✅ Accept / Completed",()=>customResult(true));
 addBtn("❌ Reject / Not Completed",()=>customResult(false));
}
function customResult(success){
 if(success){
  award(S.receiver,10);
  notice("🎉 Success! +10 points. Now "+
   playerName(S.receiver)+" gets to ask the next question.");
 }else{
  notice("Not completed or wrong answer. "+
   playerName(S.p)+" gets another turn to ask!");
 }
 continueWith(()=>nextTurn(success));
}

/* 4 -- TIC TAC TOE */

function ticStart(){
 S={board:Array(9).fill(""),p:0,over:false};
 ticRender();
}
function ticWinner(b){
 const lines=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
 ];
 return lines.some(([a,c,d])=>
  b[a]&&b[a]===b[c]&&b[a]===b[d]);
}
function ticRender(){
 show("<h3>"+playerName(S.p)+"'s Turn</h3>");
 const grid=document.createElement("div");
 grid.className="board3";
 S.board.forEach((v,i)=>{
  const b=document.createElement("button");
  b.textContent=v||" ";
  b.disabled=!!v||S.over;
  b.onclick=()=>ticMove(i);
  grid.appendChild(b);
 });
 $("screen").appendChild(grid);
}
function ticMove(i){
 if(S.over||S.board[i])return;
 S.board[i]=S.p===0?"❌":"⭕";
 if(ticWinner(S.board)){
  S.over=true;award(S.p,20);ticRender();
  addBtn("🏆 "+playerName(S.p)+" Wins!",ticStart);
 }else if(S.board.every(Boolean)){
  S.over=true;ticRender();addBtn("Draw -- Play Again",ticStart);
 }else{
  S.p=1-S.p;ticRender();
 }
}

/* 6 -- GUESS THE EMOJI
   No fixed answers: players create clues. */

function emojiStart(){
 S={p:0,round:1};
 emojiAsk();
}
function emojiAsk(){
 show(`
 <h3>${playerName(S.p)}, create an emoji puzzle</h3>
 <input id="emojiClue" placeholder="Emoji clue, e.g. 🦁👑">
 <input id="emojiSolution" placeholder="Secret answer">
 <button id="emojiSend">Send Puzzle</button>
 `);
 $("emojiSend").onclick=()=>{
  const clue=inputValue("emojiClue");
  const answer=inputValue("emojiSolution");
  if(!clue||!answer){alert("Fill both fields.");return}
  S.clue=clue;S.answer=answer;
  notice("Puzzle saved. Pass the phone to "+
   playerName(1-S.p)+".");
  continueWith(emojiGuess);
 };
}
function emojiGuess(){
 show("<h3>"+playerName(1-S.p)+
  ", guess the emoji!</h3><div class='notice'>"+
  esc(S.clue)+"</div>"+
  "<input id='emojiGuess' placeholder='Your answer'>");
 addBtn("Submit",()=>{
  const normalize=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
  const ok=normalize(inputValue("emojiGuess"))===
   normalize(S.answer);
  notice((ok?"Correct! 🎉":"Wrong guess!")+
   " Answer: "+S.answer);
  continueWith(()=>{
   if(ok){award(1-S.p);S.p=1-S.p}
   S.round++;emojiAsk();
  });
 });
}

/* 7 -- SPIN THE BOTTLE */

function bottleStart(){
 S={round:1,spinning:false};
 bottleRender();
}
function bottleRender(){
 show(`
 <h3>Round ${S.round}</h3>
 <div id="bottle" style="font-size:75px;
 transition:transform 2s ease-out;margin:25px">🍾</div>
 <p>Spin to randomly choose a player.</p>
 `);
 addBtn("Spin 🍾",()=>{
  if(S.spinning)return;
  S.spinning=true;
  const p=Math.floor(Math.random()*2);
  $("bottle").style.transform=
   "rotate("+(1440+p*180)+"deg)";
  const t=generation;
  setTimeout(()=>{
   if(t!==generation)return;
   S.spinning=false;S.p=p;
   show("<h2>"+playerName(p)+" was selected!</h2>"+
    "<textarea id='bottleTask' placeholder='The other player writes a challenge'></textarea>");
   addBtn("Give Challenge",()=>{
    const task=inputValue("bottleTask");
    if(!task){alert("Write a challenge.");return}
    notice(task);
    addBtn("Completed +10",()=>{
     award(p);S.round++;bottleRender();
    });
    addBtn("Skip",()=>{S.round++;bottleRender()});
   });
  },2100);
 });
}

/* 8 -- MEMORY MATCH */

function memoryStart(){
 const symbols=["💌","🌹","🍓","🎀","🌙","⭐","🧸","🍫"];
 S={
  cards:shuffle([...symbols,...symbols]),
  open:[],matched:[],p:0,busy:false,pairs:[0,0]
 };
 memoryRender();
}
function memoryRender(){
 show("<h3>"+playerName(S.p)+"'s Turn</h3>"+
  "<p>Pairs: "+S.pairs[0]+" -- "+S.pairs[1]+"</p>");
 const grid=document.createElement("div");
 grid.className="memory";
 S.cards.forEach((v,i)=>{
  const visible=S.open.includes(i)||S.matched.includes(i);
  const b=document.createElement("button");
  b.textContent=visible?v:"♡";
  b.disabled=visible||S.busy;
  if(S.matched.includes(i))b.className="matched";
  b.onclick=()=>memoryFlip(i);
  grid.appendChild(b);
 });
 $("screen").appendChild(grid);
}
function memoryFlip(i){
 if(S.busy||S.open.includes(i)||S.matched.includes(i))return;
 S.open.push(i);
 if(S.open.length===1){memoryRender();return}
 S.busy=true;memoryRender();
 const [a,b]=S.open;
 const match=S.cards[a]===S.cards[b];
 const t=generation;
 setTimeout(()=>{
  if(t!==generation)return;
  if(match){
   S.matched.push(a,b);S.pairs[S.p]++;award(S.p,10);
  }else S.p=1-S.p;
  S.open=[];S.busy=false;
  if(S.matched.length===S.cards.length){
   show("<h2>🎉 Game Complete!</h2>"+
    "<p>Piyaaa: "+S.pairs[0]+" pairs</p>"+
    "<p>Babuchak: "+S.pairs[1]+" pairs</p>");
   addBtn("Play Again",memoryStart);
  }else memoryRender();
 },950);
}

/* 9 -- WORD SCRAMBLE */

function wordStart(){
 S={p:0,round:1};
 wordAsk();
}
function wordAsk(){
 show("<h3>"+playerName(S.p)+
  ", enter a difficult word!</h3>"+
  "<input id='word' placeholder='Secret word'>"+
  "<input id='hint' placeholder='Optional hint'>");
 addBtn("Create Puzzle",()=>{
  const word=inputValue("word").toUpperCase();
  if(!/^[A-Z]{3,20}$/.test(word)){
   alert("Use a word of 3–20 English letters.");return;
  }
  S.word=word;S.hint=inputValue("hint");
  let scrambled=word;
  for(let i=0;i<20&&scrambled===word;i++)
   scrambled=shuffle(word.split("")).join("");
  S.scrambled=scrambled;
  notice("Word saved. Pass the phone to "+playerName(1-S.p));
  continueWith(wordGuess);
 });
}
function wordGuess(){
 show("<h3>"+playerName(1-S.p)+
  ", unscramble this!</h3>"+
  "<div class='notice' style='font-size:25px'>"+
  esc(S.scrambled)+"</div><p>Hint: "+esc(S.hint||"None")+
  "</p><input id='wordGuess' placeholder='Your answer'>");
 addBtn("Submit",()=>{
  const ok=inputValue("wordGuess").toUpperCase()===S.word;
  notice((ok?"Correct! 🎉":"Wrong!")+" Answer: "+S.word);
  continueWith(()=>{
   if(ok){award(1-S.p);S.p=1-S.p}
   S.round++;wordAsk();
  });
 });
}

/* 10 -- CONNECT FOUR */

function connectStart(){
 S={
  board:Array.from({length:6},()=>Array(7).fill(0)),
  p:0,over:false
 };
 connectRender();
}
function connectWinner(b,p){
 const directions=[[1,0],[0,1],[1,1],[1,-1]];
 for(let r=0;r<6;r++)
 for(let c=0;c<7;c++){
  if(b[r][c]!==p)continue;
  for(const [dr,dc] of directions){
   let count=0;
   for(let k=0;k<4;k++){
    const y=r+dr*k,x=c+dc*k;
    if(y>=0&&y<6&&x>=0&&x<7&&b[y][x]===p)count++;
   }
   if(count===4)return true;
  }
 }
 return false;
}
function connectRender(){
 show("<h3>"+playerName(S.p)+"'s Turn</h3>"+
  "<p>Tap a column to drop your disc.</p>");
 const grid=document.createElement("div");
 grid.className="board4";
 for(let r=0;r<6;r++)
 for(let c=0;c<7;c++){
  const v=S.board[r][c];
  const b=document.createElement("button");
  b.className=v===1?"red":v===2?"yellow":"";
  b.disabled=S.over||S.board[0][c]!==0;
  b.setAttribute("aria-label","Column "+(c+1));
  b.onclick=()=>connectMove(c);
  grid.appendChild(b);
 }
 $("screen").appendChild(grid);
}
function connectMove(c){
 if(S.over||S.board[0][c])return;
 let r=5;
 while(r>=0&&S.board[r][c])r--;
 if(r<0)return;
 const p=S.p+1;
 S.board[r][c]=p;
 if(connectWinner(S.board,p)){
  S.over=true;award(S.p,25);connectRender();
  addBtn("🏆 "+playerName(S.p)+" Wins!",connectStart);
 }else if(S.board.every(row=>row.every(Boolean))){
  S.over=true;connectRender();
  addBtn("Draw -- Play Again",connectStart);
 }else{
  S.p=1-S.p;connectRender();
 }
}
</script>
